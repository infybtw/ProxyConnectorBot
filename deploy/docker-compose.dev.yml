# Development stack: Postgres + app + Caddy (local HTTPS via internal CA).
# Usage: cp .env.example .env  &&  docker compose -f deploy/docker-compose.dev.yml up --build

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pcb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pcb}
      POSTGRES_DB: ${POSTGRES_DB:-pcb}
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    ports:
      # Exposed for local tooling (psql, GUI clients).
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pcb} -d ${POSTGRES_DB:-pcb}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN in .env}
      DATABASE_URL: postgres://${POSTGRES_USER:-pcb}:${POSTGRES_PASSWORD:-pcb}@db:5432/${POSTGRES_DB:-pcb}?sslmode=disable
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://pcb.localhost}
      HTTP_ADDR: ":8080"
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-ru}
      HWID_DEVICE_OS: ${HWID_DEVICE_OS:-android}
      HWID_VER_OS: ${HWID_VER_OS:-14}
      HWID_DEVICE_MODEL: ${HWID_DEVICE_MODEL:-Pixel 7}
      ORIGIN_USER_AGENT: ${ORIGIN_USER_AGENT:-Happ/2.4.1 (Android 14)}
      ORIGIN_TIMEOUT: ${ORIGIN_TIMEOUT:-20s}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-pcb.localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - caddy_data_dev:/data
      - caddy_config_dev:/config
    depends_on:
      - app

volumes:
  pgdata_dev:
  caddy_data_dev:
  caddy_config_dev:
