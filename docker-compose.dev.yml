# Development stack: Postgres + app + Caddy (local HTTPS via internal CA).
# Usage: cp .env.example .env  &&  docker compose -f docker-compose.dev.yml up --build

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pcb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pcb}
      POSTGRES_DB: ${POSTGRES_DB:-pcb}
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    ports:
      # Exposed for local tooling (psql, GUI clients).
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pcb} -d ${POSTGRES_DB:-pcb}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      .env
    environment:
      # Assembled automatically from the db service settings above.
      DATABASE_URL: postgres://${POSTGRES_USER:-pcb}:${POSTGRES_PASSWORD:-pcb}@db:5432/${POSTGRES_DB:-pcb}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - caddy_data_dev:/data
      - caddy_config_dev:/config
    depends_on:
      - app

volumes:
  pgdata_dev:
  caddy_data_dev:
  caddy_config_dev:
