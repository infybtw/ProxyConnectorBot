# Production stack: Postgres + app + Caddy with automatic HTTPS.
# Usage: docker compose -f docker-compose.yml up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pcb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-pcb}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pcb} -d ${POSTGRES_DB:-pcb}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN in .env}
      DATABASE_URL: postgres://${POSTGRES_USER:-pcb}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pcb}?sslmode=disable
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in .env}
      HTTP_ADDR: ":8080"
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-ru}
      HWID_DEVICE_OS: ${HWID_DEVICE_OS:-android}
      HWID_VER_OS: ${HWID_VER_OS:-14}
      HWID_DEVICE_MODEL: ${HWID_DEVICE_MODEL:-Pixel 7}
      ORIGIN_USER_AGENT: ${ORIGIN_USER_AGENT:-Happ/2.4.1 (Android 14)}
      ORIGIN_TIMEOUT: ${ORIGIN_TIMEOUT:-20s}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in .env}
      CADDY_EMAIL: ${CADDY_EMAIL:?set CADDY_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
